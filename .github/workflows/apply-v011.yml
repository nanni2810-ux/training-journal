name: Apply Training Journal v0.1.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v011.yml'
      - 'release/v0.1.1/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild release patch
        shell: bash
        run: |
          cat release/v0.1.1/patch.gz.b64.part* | base64 -d | gunzip > /tmp/v011.patch
          git apply --check /tmp/v011.patch
          git apply /tmp/v011.patch

      - name: Validate JavaScript
        shell: bash
        run: |
          node --check app.js
          node --check sw.js
          grep -q "const VERSION='0.1.1'" app.js
          grep -q "training-journal-v0.1.1" sw.js
          grep -q "app.js?v=0.1.1" index.html

      - name: Commit release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css index.html sw.js README.md
          git commit -m "Release Training Journal v0.1.1"
          git push
