name: Unpack Training Journal source

on:
  push:
    branches: [main]
    paths:
      - 'bundle/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat bundle/part-*.b64 | tr -d '\n\r' | base64 -d > /tmp/training-journal.tar.xz
          xz -t /tmp/training-journal.tar.xz
          tar -xJf /tmp/training-journal.tar.xz -C .
          test -f index.html
          test -f app.js
          test -f sw.js

      - name: Commit unpacked source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Source already up to date."
            exit 0
          fi
          git commit -m "Unpack Training Journal v0.1.0"
          git push
