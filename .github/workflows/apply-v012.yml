name: Apply Training Journal v0.1.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v012.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.1.2
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('app.js')
          s=p.read_text()
          if "const VERSION='0.1.2'" in s:
              print('v0.1.2 already applied')
          else:
              if "const VERSION='0.1.1'" not in s:
                  raise SystemExit('Unexpected app version')
              s=s.replace("const VERSION='0.1.1';", "const VERSION='0.1.2';", 1)

              old_template=re.search(r"function templateSections\(name\)\{[^\n]*\}\n", s)
              if not old_template:
                  raise SystemExit('templateSections not found')
              new_template=r'''function templateSections(name){
                if(name==='hybridcrossfit'||name==='crossfit'||name==='hybrid')return ['warmup','tabata','skill','strength','wod','cooldown'].map(newSection);
                if(name==='hyrox'){const x=['warmup','strength','metcon','wod','cooldown'].map(newSection);const m=x.find(s=>s.type==='metcon');if(m)m.title='HYROX / Running + Stations';return x}
                if(name==='weightlifting'||name==='wlmetcon')return ['warmup','weightlifting','strength','core','cooldown'].map(newSection);
                if(name==='metabolic'){const x=['warmup','metcon','wod','cooldown'].map(newSection);const m=x.find(s=>s.type==='metcon');if(m)m.title='Metabolic / Running';return x}
                return []
              }
'''
              s=s[:old_template.start()]+new_template+s[old_template.end():]

              parser=r'''
function importHeaderKey(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9/& +'-]+/g,' ').replace(/\s+/g,' ').trim().toLowerCase()}
function detectImportedSection(line){const h=importHeaderKey(line);if(/^(riscaldamento|warm ?up)$/.test(h))return'warmup';if(/^tabata$/.test(h))return'tabata';if(/^skill$/.test(h))return'skill';if(/^(forza|strength)$/.test(h))return'strength';if(/^(pesistica|weightlifting|olympic lifting)$/.test(h))return'weightlifting';if(/^(wod|workout)$/.test(h))return'wod';if(/^(metcon|metabolic|metabolic conditioning|running)$/.test(h))return'metcon';if(/^(core|core / accessory|accessory)$/.test(h))return'core';if(/^(cooldown|cool down|stretching|defaticamento)$/.test(h))return'cooldown';return''}
function importedDate(text){const m=String(text||'').match(/\b(\d{1,2})\/(\d{1,2})\/(\d{2,4})\b/);if(!m)return'';let y=Number(m[3]);if(y<100)y+=2000;return`${y}-${String(Number(m[2])).padStart(2,'0')}-${String(Number(m[1])).padStart(2,'0')}`}
function importedTitle(line){return String(line||'').replace(/\b\d{1,2}\/\d{1,2}\/\d{2,4}\b/g,'').replace(/[^A-Za-zÀ-ÿ0-9&+/' -]+/g,' ').replace(/\s+/g,' ').trim()}
function importedSimpleRow(line){const raw=String(line||'').trim();const m=raw.match(/^((?:\d+(?:[.,]\d+)?(?:\+\d+)?)(?:\s*(?:[’'′\"]|sec(?:ondi)?|s|min(?:uti)?|m))?)\s+(.+)$/i);return{id:uid('row'),exercise:m?m[2].trim():raw,reps:m?m[1].trim():'',note:''}}
function parseImportedWarmup(lines){const s=newSection('warmup');s.rows=[];let roundIndex=-1;for(let i=0;i<lines.length;i++){const m=lines[i].match(/^(\d+)\s*(rounds?|giri)(?:\s+(not for time|nft))?\s*$/i);if(m){roundIndex=i;s.amount=m[1];s.scheme=m[3]?'Not For Time':'Rounds';break}}
  if(roundIndex>=0){const before=lines.slice(0,roundIndex).filter(x=>!/^then$/i.test(x));const hadThen=lines.slice(0,roundIndex).some(x=>/^then$/i.test(x));s.intro=[...before,hadThen?'Then':''].filter(Boolean).join(' · ');s.rows=lines.slice(roundIndex+1).filter(Boolean).map(importedSimpleRow)}else{s.rows=lines.filter(x=>!/^then$/i.test(x)).map(importedSimpleRow);s.intro=lines.some(x=>/^then$/i.test(x))?'Then':''}
  if(!s.rows.length)s.rows=[{id:uid('row'),exercise:'',reps:'',note:''}];return s}
function parseImportedTabata(lines){const s=newSection('tabata'),items=[];for(const line of lines){let m=line.match(/^(?:work|lavoro)\s*:?\s*(.+)$/i);if(m){s.work=m[1].trim();continue}m=line.match(/^(?:rest|recupero)\s*:?\s*(.+)$/i);if(m){s.rest=m[1].trim();continue}m=line.match(/^(?:rounds?|giri)\s*:?\s*(\d+)/i);if(m){s.rounds=m[1];continue}items.push(line)}s.items=items.length?items:[''];return s}
function parseImportedLift(lines,type){const s=newSection(type);s.rows=[];for(const line of lines){const raw=line.trim();if(!raw)continue;let exercise=raw,sets='',reps='',load='',note='';let m=raw.match(/^(.+?)\s+(\d+)\s*[x×]\s*([^@]+?)(?:\s*@\s*([\d.,-]+)\s*kg?)?(?:\s+(.*))?$/i);if(m){exercise=m[1].trim();sets=m[2];reps=m[3].trim();load=(m[4]||'').trim();note=(m[5]||'').trim()}s.rows.push({...newLiftRow(),exercise,sets,reps,load,attempts:note})}if(!s.rows.length)s.rows=[newLiftRow()];return s}
function parseImportedWod(lines){const s=newSection('wod');s.name='WOD';let body=[...lines];const formatIndex=body.findIndex(x=>/^(for time|amrap\b.*|emom\b.*|e\d+mom\b.*|chipper|intervals?|intervalli)$/i.test(x.trim()));if(formatIndex>=0){s.format=body[formatIndex].trim();body.splice(formatIndex,1)}else{s.format=''}const low=(s.format||'').toLowerCase();s.scoreType=low.startsWith('amrap')?'rounds_plus_reps':low.includes('for time')||low==='chipper'?'time':'time';s.text=body.join('\n').trim();return s}
function parseWorkoutMessage(text){const lines=String(text||'').replace(/\r/g,'').split('\n').map(x=>x.trim()),nonempty=lines.filter(Boolean);if(!nonempty.length)return{title:'',date:'',sections:[]};const date=importedDate(text),first=nonempty[0],title=detectImportedSection(first)?'':importedTitle(first);const groups=[];let current=null;for(let i=title?lines.indexOf(first)+1:0;i<lines.length;i++){const line=lines[i];if(!line)continue;const type=detectImportedSection(line);if(type){current={type,lines:[]};groups.push(current);continue}if(current)current.lines.push(line)}const sections=groups.map(g=>{if(g.type==='warmup'||g.type==='core')return parseImportedWarmup(g.lines);if(g.type==='tabata')return parseImportedTabata(g.lines);if(g.type==='skill'||g.type==='metcon'||g.type==='cooldown'){const s=newSection(g.type);s.text=g.lines.join('\n').trim();return s}if(g.type==='strength'||g.type==='weightlifting')return parseImportedLift(g.lines,g.type);if(g.type==='wod')return parseImportedWod(g.lines);const s=newSection('custom');s.text=g.lines.join('\n');return s});return{title,date,sections}}
function showWorkoutMessageImport(){openModal('Importa allenamento',`<div class="field"><label>Incolla il messaggio completo</label><textarea id="workoutImportText" style="min-height:360px" placeholder="Incolla qui Hybrid Class, CrossFit, HYROX, Weightlifting o un altro allenamento strutturato..."></textarea></div><div class="card compact" style="margin-top:10px"><strong>Riconoscimento automatico</strong><p class="muted small" style="margin-bottom:0">Data, titolo, Riscaldamento, Tabata, Skill, Forza/Pesistica, Metcon, WOD, Core e Cooldown vengono separati nelle rispettive sezioni.</p></div><div class="actions end" style="margin-top:12px"><button class="button ghost" data-action="close-modal">Annulla</button><button class="button accent" data-action="apply-workout-import">Genera allenamento</button></div>`,`Il testo originale resta modificabile dopo l'importazione.`)}
function applyWorkoutMessageImport(){const el=document.getElementById('workoutImportText'),text=el?.value||'';if(!text.trim()){showToast('Incolla prima un allenamento');return}const parsed=parseWorkoutMessage(text);if(!parsed.sections.length){showToast('Non ho riconosciuto sezioni nel messaggio');return}if(view.draft.sections.length&&!confirm('Sostituire le sezioni attuali con quelle importate?'))return;if(parsed.date)view.draft.date=parsed.date;if(parsed.title)view.draft.title=parsed.title;view.draft.sections=parsed.sections;closeModal();const d=document.getElementById('workoutDate'),t=document.getElementById('workoutTitle');if(d)d.value=view.draft.date;if(t)t.value=view.draft.title;rerenderDraftSections();showToast(`${parsed.sections.length} sezioni importate`)}
'''
              marker='function renderWorkoutEditor(id,date)'
              if marker not in s:
                  raise SystemExit('renderWorkoutEditor marker not found')
              s=s.replace(marker, parser+'\n'+marker, 1)

              replacements={
                'data-template="crossfit">CrossFit</button>':'data-template="hybridcrossfit">Hybrid / CrossFit</button>',
                'data-template="hybrid">Hybrid</button>':'data-template="hyrox">HYROX</button>',
                'data-template="wlmetcon">WL + Metcon</button>':'data-template="weightlifting">Weightlifting</button><button class="button ghost small" data-action="workout-template" data-template="metabolic">Metabolic / Running</button>'
              }
              for old,new in replacements.items():
                  if old not in s:
                      raise SystemExit(f'Editor template marker not found: {old}')
                  s=s.replace(old,new,1)
              model_marker='<span class="muted small">Modelli:</span>'
              if model_marker not in s:
                  raise SystemExit('Model label not found')
              s=s.replace(model_marker,'<button class="button secondary small" data-action="import-workout-message">📋 Importa messaggio</button><span class="muted small">Modelli:</span>',1)

              action_marker="if(a==='workout-template'){"
              if action_marker not in s:
                  raise SystemExit('Action marker not found')
              s=s.replace(action_marker,"if(a==='close-modal')return closeModal();if(a==='import-workout-message')return showWorkoutMessageImport();if(a==='apply-workout-import')return applyWorkoutMessageImport();"+action_marker,1)
              p.write_text(s)

          p=Path('index.html')
          s=p.read_text().replace('styles.css?v=0.1.1','styles.css?v=0.1.2').replace('app.js?v=0.1.1','app.js?v=0.1.2')
          p.write_text(s)

          p=Path('sw.js')
          s=p.read_text().replace('training-journal-v0.1.1','training-journal-v0.1.2').replace('styles.css?v=0.1.1','styles.css?v=0.1.2').replace('app.js?v=0.1.1','app.js?v=0.1.2')
          p.write_text(s)

          p=Path('README.md')
          s=p.read_text()
          s=re.sub(r'^# Training Journal v[^ ]+', '# Training Journal v0.1.2', s, count=1, flags=re.M)
          if '## Novità v0.1.2' not in s:
              s += '''\n\n## Novità v0.1.2\n\n- importazione di un allenamento completo da testo/messaggio con riconoscimento automatico di data, titolo e sezioni\n- parser per Riscaldamento, Tabata, Skill, Forza/Pesistica, Metcon, WOD, Core e Cooldown\n- modelli aggiornati: Hybrid / CrossFit, HYROX, Weightlifting, Metabolic / Running\n- i contenuti importati restano completamente modificabili prima del salvataggio\n'''
          p.write_text(s)
          PY

      - name: Validate
        shell: bash
        run: |
          node --check app.js
          node --check sw.js
          grep -q "const VERSION='0.1.2'" app.js
          grep -q "parseWorkoutMessage" app.js
          grep -q "Hybrid / CrossFit" app.js
          grep -q "HYROX" app.js
          grep -q "Metabolic / Running" app.js
          grep -q "training-journal-v0.1.2" sw.js
          grep -q "app.js?v=0.1.2" index.html

      - name: Commit v0.1.2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html sw.js README.md
          if git diff --cached --quiet; then
            echo "No v0.1.2 changes to commit"
            exit 0
          fi
          git commit -m "Release Training Journal v0.1.2"
          git push
